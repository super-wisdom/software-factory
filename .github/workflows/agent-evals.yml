name: agent-evals
on:
  push:
    paths:
      - "CLAUDE.md"
      - ".claude/**"
      - "evals/**"
      - "templates/**"
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC nightly
  workflow_dispatch:
jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip && pip install -e ".[dev]"
      - name: Run agent-config eval suite
        run: python -m software_factory.cli eval
